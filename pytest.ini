[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
testpaths = tests
addopts = --strict-markers --tb=short -p no:asyncio -p no:cacheprovider --basetemp=.pytest_tmp --ignore=.pytest_cache
norecursedirs = .git .pytest_cache .pytest_tmp .python312 .venv venv venv_* env node_modules
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
