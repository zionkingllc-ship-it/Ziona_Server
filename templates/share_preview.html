<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ caption|truncatewords:10 }} — {{ app_name }}</title>

    <meta property="og:type" content="article">
    <meta property="og:title" content="{{ author.username }} on {{ app_name }}">
    <meta property="og:description" content="{{ caption|truncatewords:30 }}">
    <meta property="og:url" content="{{ post_url }}">
    {% if preview_image %}
    <meta property="og:image" content="{{ preview_image }}">
    {% endif %}
    <meta property="og:site_name" content="{{ app_name }}">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{ author.username }} on {{ app_name }}">
    <meta name="twitter:description" content="{{ caption|truncatewords:30 }}">
    {% if preview_image %}
    <meta name="twitter:image" content="{{ preview_image }}">
    {% endif %}

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 600px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
            background: #fafafa;
        }
        .logo { font-size: 2em; margin-bottom: 20px; }
        .caption { font-size: 1.1em; color: #333; margin: 20px 0; }
        .author { color: #666; font-size: 0.9em; }
        .cta {
            display: inline-block;
            margin-top: 30px;
            padding: 12px 36px;
            background: #6c63ff;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .cta:hover { background: #5a52d9; }
        .stores { margin-top: 24px; }
        .store-link {
            display: inline-block;
            margin: 8px;
            padding: 10px 24px;
            border: 1px solid #ccc;
            border-radius: 8px;
            color: #333;
            text-decoration: none;
            font-size: 0.95em;
        }
        .store-link:hover { border-color: #6c63ff; color: #6c63ff; }
        .hint { color: #999; font-size: 0.85em; margin-top: 28px; }
    </style>
</head>
<body>
    <div class="logo">✝️ {{ app_name }}</div>
    <p class="author">@{{ author.username }}</p>
    <p class="caption">{{ caption }}</p>
    {% if preview_image %}
    <img src="{{ preview_image }}" alt="Post preview" style="max-width: 100%; border-radius: 12px;">
    {% endif %}
    <br>
    <a href="{{ post_url }}" class="cta" id="open-app">Open in {{ app_name }}</a>

    <div class="stores">
        <a href="{{ ios_app_store_url }}" class="store-link" id="ios-store">Download on the App Store</a>
        <a href="{{ android_play_store_url }}" class="store-link" id="android-store">Get it on Google Play</a>
    </div>
    <p class="hint">Don’t have the app? Install it, then reopen this link.</p>

    <script>
        // If the app is installed, the OS intercepts the https link and this page
        // never renders. When it DOES render (app missing / desktop), show only the
        // relevant store on mobile; keep both for desktop and link-preview bots.
        (function () {
            var ua = navigator.userAgent || "";
            var isIOS = /iPad|iPhone|iPod/.test(ua);
            var isAndroid = /Android/.test(ua);
            var ios = document.getElementById("ios-store");
            var android = document.getElementById("android-store");
            if (isIOS && android) { android.style.display = "none"; }
            if (isAndroid && ios) { ios.style.display = "none"; }
        })();
    </script>
</body>
</html>
