# Render deployment configuration
#
# Production uses native Python runtime plus imageio-ffmpeg; no Docker image is
# needed for media workers. Scheduled jobs are Render cron services instead of a
# continuously running Celery beat service to keep monthly cost lower.

services:
  - type: web
    name: ziona-api-staging
    runtime: python
    region: oregon
    plan: starter
    branch: staging
    autoDeployTrigger: checksPass
    buildCommand: &buildCommand >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 --keep-alive 120
    envVars: &stagingEnv
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.staging
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ALLOWED_HOSTS
        value: ziona-api-staging.onrender.com,api.staging.ziona.app
      - key: ENABLE_DJANGO_ADMIN
        value: "true"
      - key: ENABLE_PUBLIC_API_DOCS
        value: "true"
      - key: ENABLE_GRAPHQL_STATIC_DOCS
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      # Bundle id of the STAGING build. Feeds the Universal Links appID in
      # well-known/apple-app-site-association, so it must match the bundle the
      # staging app actually ships as, not production's.
      - key: APPLE_BUNDLE_ID
        value: com.zionking.ziona.staging
      - key: APPLE_CLIENT_IDS
        sync: false
      # Apple Team ID for iOS Universal Links (well-known/apple-app-site-association).
      - key: APPLE_TEAM_ID
        value: RLL2NX9J5Z
      - key: ANDROID_APP_PACKAGE_NAME
        value: com.zionking.ziona.staging
      # Staging upload-key SHA-256. Staging is not on Play yet, so there is a
      # single key; once it reaches an internal track the Play App Signing
      # SHA-256 must be appended here or App Links will stop verifying.
      - key: ANDROID_SHA256_CERT_FINGERPRINTS
        value: B8:01:9A:D4:37:0C:D5:F4:4F:4F:AF:29:CA:65:2F:54:84:BE:47:9C:24:3E:B1:10:D7:76:FE:10:82:75:97:2C
      # Domain the staging build declares in Associated Domains
      # (applinks:staging.ziona.app). Share links must point at the host serving
      # the matching well-known files, or the app is never opened.
      - key: APP_SHARE_BASE_URL
        value: https://staging.ziona.app
      - key: ENSEND_API_KEY
        sync: false
      - key: ENSEND_API_URL
        value: https://api.smtpexpress.com/send
      - key: DEFAULT_FROM_EMAIL
        value: noreply@ziona.app
      - key: ENSEND_SENDER_NAME
        value: Ziona Team
      - key: SENTRY_DSN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_ONE_TIME_PRODUCT_ID
        sync: false
      - key: STRIPE_MONTHLY_PRODUCT_ID
        sync: false
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        # Frontend host (browser redirect target). checkout_success_url() appends
        # ?checkoutSessionId={CHECKOUT_SESSION_ID} — keep the base URL only here.
        value: https://staging.ziona.app/support/success
      - key: STRIPE_CHECKOUT_CANCEL_URL
        value: https://staging.ziona.app/support
      - key: STRIPE_PORTAL_RETURN_URL
        value: https://staging.ziona.app/settings/support
      - key: STRIPE_PORTAL_LOGIN_URL
        sync: false
      - key: STRIPE_SUPPORT_MAX_AMOUNT_USD
        value: "10000"
      - key: STRIPE_CURRENCY
        value: usd
      # Staging API CORS: staging frontends + localhost ONLY. Prod origins are
      # deliberately excluded so a prod build mistakenly pointed at staging
      # fails loudly instead of silently writing prod data with staging URLs.
      - key: CORS_ALLOWED_ORIGINS
        value: https://staging.ziona.app,https://ziona-admin-dashboard-git-staging-zionking-llc.vercel.app,https://ziona-admin-dashboard.vercel.app,https://admin.staging.ziona.app,http://localhost:3000,http://localhost:8080
      - key: GCS_CORS_ALLOWED_ORIGINS
        value: https://staging.ziona.app,https://ziona-admin-dashboard-git-staging-zionking-llc.vercel.app,https://ziona-admin-dashboard.vercel.app,https://admin.staging.ziona.app,http://localhost:3000,http://localhost:8080
      - key: GCP_STORAGE_BUCKET
        value: ziona-media-dev
      - key: GCP_SIGNED_URL_EXPIRY
        value: "3600"
      - key: MEDIA_STALE_UPLOAD_MINUTES
        value: "15"
      # Keep staging capped until a dedicated Standard media worker is provisioned.
      # The resumable endpoint remains available for mobile integration testing.
      - key: MEDIA_VIDEO_MAX_UPLOAD_MB
        value: "100"
      - key: MEDIA_RESUMABLE_UPLOADS_ENABLED
        value: "true"
      - key: MEDIA_RESUMABLE_VIDEO_MAX_UPLOAD_MB
        value: "100"
      - key: MEDIA_RESUMABLE_UPLOAD_RECOMMENDED_CHUNK_MB
        value: "8"
      - key: MEDIA_RESUMABLE_UPLOAD_SESSION_TIMEOUT_SECONDS
        value: "60"
      - key: MEDIA_VIDEO_MAX_DURATION_SECONDS
        value: "150"
      - key: MEDIA_CIRCLE_VIDEO_MAX_DURATION_SECONDS
        value: "150"
      - key: MEDIA_VIDEO_OPTIMIZE_TIMEOUT_SECONDS
        value: "840"
      - key: MEDIA_VIDEO_TASK_SOFT_TIME_LIMIT_SECONDS
        value: "900"
      - key: MEDIA_VIDEO_TASK_TIME_LIMIT_SECONDS
        value: "960"
      - key: MEDIA_THUMBNAIL_TIMEOUT_SECONDS
        value: "120"
      - key: MEDIA_THUMBNAIL_TASK_TIME_LIMIT_SECONDS
        value: "180"
      - key: AUTH_REFRESH_TOKEN_INACTIVITY_DAYS
        value: "30"
      - key: AUTH_REVOKE_ON_REFRESH_TOKEN_REUSE
        value: "true"
      - key: AUTH_CHANGE_PASSWORD_REQUIRES_OTP
        value: "false"
      - key: GCP_CREDENTIALS_FILE
        value: /etc/secrets/gcp-credentials.json
      - key: FIREBASE_CREDENTIALS_FILE
        value: /etc/secrets/firebase-credentials.json
      - key: ACCOUNT_RECOVERY_TOKEN_LIFETIME_MINUTES
        value: "15"
      - key: ACCOUNT_DELETION_GRACE_DAYS
        value: "30"
      - key: ACCOUNT_DELETION_PURGE_MAX_RETRIES
        value: "5"
      - key: RATE_LIMIT_REGISTER
        value: "30/60m"

  - type: worker
    name: ziona-worker-staging
    runtime: python
    region: oregon
    plan: starter
    branch: staging
    autoDeployTrigger: checksPass
    buildCommand: *buildCommand
    startCommand: python manage.py check_media_runtime && celery -A config worker --loglevel=info --concurrency=1 -Q email,default,media,cron,celery
    envVars: *stagingEnv

  - type: web
    name: ziona-api-prod
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: *buildCommand
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --threads 2 --timeout 120 --keep-alive 120
    envVars: &prodEnv
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ALLOWED_HOSTS
        value: api.ziona.app,ziona-server.onrender.com
      - key: ENABLE_DJANGO_ADMIN
        value: "false"
      - key: ENABLE_PUBLIC_API_DOCS
        value: "false"
      - key: ENABLE_GRAPHQL_STATIC_DOCS
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://ziona.app,https://www.ziona.app,https://admin.ziona.app,https://zionking.org,https://www.zionking.org
      - key: GCS_CORS_ALLOWED_ORIGINS
        value: https://ziona.app,https://www.ziona.app,https://admin.ziona.app,https://zionking.org,https://www.zionking.org
      - key: GCP_STORAGE_BUCKET
        value: ziona-media-prod
      - key: GCP_SIGNED_URL_EXPIRY
        value: "3600"
      - key: MEDIA_STALE_UPLOAD_MINUTES
        value: "15"
      - key: MEDIA_VIDEO_MAX_UPLOAD_MB
        value: "100"
      - key: MEDIA_RESUMABLE_UPLOADS_ENABLED
        value: "false"
      - key: MEDIA_RESUMABLE_VIDEO_MAX_UPLOAD_MB
        value: "500"
      - key: MEDIA_RESUMABLE_UPLOAD_RECOMMENDED_CHUNK_MB
        value: "8"
      - key: MEDIA_RESUMABLE_UPLOAD_SESSION_TIMEOUT_SECONDS
        value: "60"
      - key: MEDIA_VIDEO_MAX_DURATION_SECONDS
        value: "150"
      - key: MEDIA_CIRCLE_VIDEO_MAX_DURATION_SECONDS
        value: "150"
      - key: MEDIA_VIDEO_OPTIMIZE_TIMEOUT_SECONDS
        value: "840"
      - key: MEDIA_VIDEO_TASK_SOFT_TIME_LIMIT_SECONDS
        value: "900"
      - key: MEDIA_VIDEO_TASK_TIME_LIMIT_SECONDS
        value: "960"
      - key: MEDIA_THUMBNAIL_TIMEOUT_SECONDS
        value: "120"
      - key: MEDIA_THUMBNAIL_TASK_TIME_LIMIT_SECONDS
        value: "180"
      - key: AUTH_REFRESH_TOKEN_INACTIVITY_DAYS
        value: "30"
      - key: AUTH_REVOKE_ON_REFRESH_TOKEN_REUSE
        value: "false"
      - key: AUTH_CHANGE_PASSWORD_REQUIRES_OTP
        value: "false"
      - key: GCP_CREDENTIALS_FILE
        value: /etc/secrets/gcp-credentials.json
      - key: FIREBASE_CREDENTIALS_FILE
        value: /etc/secrets/firebase-credentials.json
      - key: ACCOUNT_RECOVERY_TOKEN_LIFETIME_MINUTES
        value: "15"
      - key: ACCOUNT_DELETION_GRACE_DAYS
        value: "30"
      - key: ACCOUNT_DELETION_PURGE_MAX_RETRIES
        value: "5"
      - key: RATE_LIMIT_REGISTER
        value: "20/60m"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: GOOGLE_CLIENT_IDS
        sync: false
      - key: APPLE_BUNDLE_ID
        value: com.zionking.ziona
      - key: APPLE_CLIENT_IDS
        sync: false
      # Apple Team ID for iOS Universal Links (well-known/apple-app-site-association).
      - key: APPLE_TEAM_ID
        value: RLL2NX9J5Z
      - key: ANDROID_APP_PACKAGE_NAME
        value: com.zionking.ziona
      # Production upload key + Play App Signing key — both must be listed,
      # because Play re-signs the uploaded artifact.
      - key: ANDROID_SHA256_CERT_FINGERPRINTS
        value: B6:A8:22:F3:C7:E0:71:56:6B:24:93:C4:57:6A:85:D9:81:01:65:3D:BD:CB:70:D2:0E:34:23:4B:5D:45:6B:52,53:5B:CE:7A:2F:80:80:F4:2C:66:77:6E:9E:C7:E9:15:72:79:D5:52:73:1A:58:B1:81:6A:B7:26:23:1C:72:68
      # Set explicitly rather than relying on the settings default: leaving it
      # unset is what made staging generate production share links.
      - key: APP_SHARE_BASE_URL
        value: https://www.ziona.app
      - key: ENSEND_API_KEY
        sync: false
      - key: ENSEND_API_URL
        value: https://api.smtpexpress.com/send
      - key: DEFAULT_FROM_EMAIL
        value: noreply@ziona.app
      - key: ENSEND_SENDER_NAME
        value: Ziona Team
      - key: SENTRY_DSN
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_MONTHLY_PRICE_ID
        sync: false
      - key: STRIPE_ONE_TIME_PRODUCT_ID
        sync: false
      - key: STRIPE_MONTHLY_PRODUCT_ID
        sync: false
      - key: STRIPE_CHECKOUT_SUCCESS_URL
        # Frontend host (browser redirect target). checkout_success_url() appends
        # ?checkoutSessionId={CHECKOUT_SESSION_ID} — keep the base URL only here.
        value: https://www.ziona.app/support/success
      - key: STRIPE_CHECKOUT_CANCEL_URL
        value: https://www.ziona.app/support
      - key: STRIPE_PORTAL_RETURN_URL
        value: https://ziona.app/settings/support
      - key: STRIPE_PORTAL_LOGIN_URL
        sync: false
      - key: STRIPE_SUPPORT_MAX_AMOUNT_USD
        value: "10000"
      - key: STRIPE_CURRENCY
        value: usd

  - type: worker
    name: ziona-worker-prod
    runtime: python
    region: oregon
    plan: standard
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: *buildCommand
    startCommand: python manage.py check_media_runtime && celery -A config worker --loglevel=info --concurrency=1 -Q email,default,media,cron,celery
    envVars: *prodEnv

  - type: cron
    name: ziona-cron-check-scheduled-anchors
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "*/5 * * * *"
    buildCommand: *buildCommand
    startCommand: python manage.py enqueue_scheduled_task check-scheduled-anchors
    envVars: *prodEnv

  - type: cron
    name: ziona-cron-refresh-dashboard-cache
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "*/15 * * * *"
    buildCommand: *buildCommand
    startCommand: python manage.py enqueue_scheduled_task refresh-dashboard-cache
    envVars: *prodEnv

  - type: cron
    name: ziona-cron-refresh-company-stats
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "0 * * * *"
    buildCommand: *buildCommand
    startCommand: python manage.py enqueue_scheduled_task refresh-company-stats
    envVars: *prodEnv

  - type: cron
    name: ziona-cron-daily-anchor-notifications
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "0 18 * * *"
    buildCommand: *buildCommand
    startCommand: python manage.py enqueue_scheduled_task send-daily-anchor-notifications
    envVars: *prodEnv

  - type: cron
    name: ziona-cron-notification-digest
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "0 8 * * *"
    buildCommand: *buildCommand
    startCommand: python manage.py enqueue_scheduled_task send-daily-notification-digest
    envVars: *prodEnv

  - type: cron
    name: ziona-cron-daily-analytics
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "5 0 * * *"
    buildCommand: *buildCommand
    startCommand: python manage.py enqueue_scheduled_task calculate-daily-analytics
    envVars: *prodEnv

  - type: cron
    name: ziona-cron-expired-anchor-purge
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "0 2 * * *"
    buildCommand: *buildCommand
    startCommand: python manage.py enqueue_scheduled_task purge-expired-anchors
    envVars: *prodEnv

  - type: cron
    name: ziona-cron-notification-cleanup
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "0 2 * * 0"
    buildCommand: *buildCommand
    startCommand: python manage.py enqueue_scheduled_task cleanup-old-notifications
    envVars: *prodEnv

  - type: cron
    name: ziona-cron-inactive-session-cleanup
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "30 2 * * *"
    buildCommand: *buildCommand
    startCommand: python manage.py enqueue_scheduled_task cleanup-inactive-refresh-tokens
    envVars: *prodEnv

  - type: cron
    name: ziona-cron-stale-media-cleanup
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "*/10 * * * *"
    buildCommand: *buildCommand
    startCommand: python manage.py enqueue_scheduled_task cleanup-stale-media
    envVars: *prodEnv

  - type: cron
    name: ziona-cron-account-deletion-purge
    runtime: python
    region: oregon
    plan: starter
    branch: main
    autoDeployTrigger: checksPass
    schedule: "17 * * * *"
    buildCommand: *buildCommand
    startCommand: python manage.py enqueue_scheduled_task purge-due-account-deletions
    envVars: *prodEnv
